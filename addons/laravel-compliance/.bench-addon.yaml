name: laravel-compliance
version: 0.1.0
description: |
  PII, audit-logging, and data-retention guidance for Laravel apps that handle
  sensitive or regulated data. Ships the COMPLIANCE-001/002/003 patterns
  (identify + protect PII, append-only audit trails, retention + right-to-be-
  forgotten) plus a /compliance-check command + agent that reviews a model or
  feature against them and reports gaps.

  Opt-in addon — install per-project with:
    bench addon add laravel-compliance

depends_on:
  bench: ">=0.8.0"

license: MIT
