# .bench/ci.yaml — the project's quality pipeline (read by the `ci` agent)
#
# A map of named TRIGGERS, each an ORDERED list of STAGES. The agent runs a trigger's
# stages top-to-bottom, stops at the first failure, and reports GREEN/RED. The project
# owns this file — bench seeds a sensible default; you shape it freely.
#
# Trigger vocabulary (all optional except you'll usually have on_done):
#   on_done       — all coding for a task is finished (the default; run before reporting done)
#   before_start  — about to start a unit of work
#   before_commit — about to commit
#
# A STAGE is:
#   name:          short label (shown in the report; matchable by `/ci --only=<name>`)
#   run:           a shell command            \  exactly ONE of run/skill
#   skill:         a bench skill/plugin call  /  (e.g. "code-review", "/e2e-run", "/docs")
#   when_changed:  optional glob — run the stage only if the diff touches a match
#                  (omit it for "always"; prefer commands that self-gate, e.g.
#                   `preflight --changed`, turbo/nx affected — don't reinvent detection)
#   fix:           true for an auto-fixer (optional; default false)

triggers:
  on_done:
    - name: format
      run: "vendor/bin/pint"        # auto-fix formatting; report the diff
      fix: true
    - name: test
      run: "php artisan test"

