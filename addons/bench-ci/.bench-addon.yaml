name: bench-ci
version: 0.2.0
description: |
  An interview-driven, customizable quality pipeline that maps lifecycle triggers
  (on_done, before_commit, before_start) to ordered lists of stages — each stage
  a shell command or bench skill/plugin — executed by the `ci` agent stop-on-first-
  failure with GREEN/RED reporting. Seeded with a minimal Pint+test default; the
  setup interview grows the pipeline into a full review→e2e→docs chain and surfaces
  install commands for any missing addon. Enforced via a pasteable CLAUDE.md snippet
  (bench never writes the project's CLAUDE.md).

  Opt-in addon — install per-project with:
    bench addon add bench-ci

depends_on:
  bench: ">=0.8.0"

license: MIT
