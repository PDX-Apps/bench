name: bench-ci
version: 0.1.0
description: |
  A quality gate that runs the project's OWN declared checks — an ordered list of
  steps the project defines (format, static analysis, tests, or any bespoke
  command), auto-fixing `fix:` steps first, then reporting failures cleanly with
  an actionable diagnosis. The steps are declared once in .bench/ci.yaml (the `ci`
  concern captures them at setup, pre-filled with a common baseline), so the
  runner executes exactly what's defined rather than imposing a scope or guessing.

  Opt-in addon — install per-project with:
    bench addon add bench-ci

depends_on:
  bench: ">=0.8.0"

license: MIT
