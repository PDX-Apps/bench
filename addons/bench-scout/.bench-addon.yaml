name: bench-scout
version: 0.1.0
description: |
  Laravel Scout full-text search — the Searchable trait, toSearchableArray,
  index configuration, search queries + pagination, conditional and queued
  indexing, and driver choice (Algolia / Meilisearch / Typesense / database).
  Ships a /scout command + agent and the SCOUT-001 pattern.

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/bench-scout

depends_on:
  bench: ">=0.8.0"

license: MIT
