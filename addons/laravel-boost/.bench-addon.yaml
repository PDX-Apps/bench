name: laravel-boost
version: 0.1.0
description: |
  Makes Bench agents aware of Laravel Boost (laravel/boost), an MCP server that
  gives AI assistants direct Laravel tooling: database-schema, database-query,
  tinker, database-query, search-docs, application-info, last-error,
  and more.

  Ships two things:
    1. An awareness pattern so worker agents prefer Boost MCP tools over
       filesystem scans / artisan parsing when the data is structured.
    2. A /boost-install slash command that walks through composer install +
       php artisan boost:install + MCP registration with user permission at
       each step.

  Opt-in addon — install per-project with:
    bench addon add laravel-boost

depends_on:
  bench: ">=0.8.0"

homepage: https://github.com/laravel/boost
license: MIT
