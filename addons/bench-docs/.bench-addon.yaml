name: bench-docs
version: 0.1.0
description: |
  Generate or refresh audience-facing project documentation FROM the code — a
  README/feature doc, an end-user guide, a developer guide, or your own custom doc
  types — grounded in the actual files, not guesswork. Scans the feature/module
  first, then writes docs that match what the code really does. Doc types,
  placement, and templates are captured per-project in .bench/docs.yaml. (API
  references come from laravel-swagger / OpenAPI; ADRs and plans from bench-plan.)

  Opt-in addon — install per-project with:
    bench addon add bench-docs

depends_on:
  bench: ">=0.8.0"

license: MIT
