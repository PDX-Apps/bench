name: bench-filament
version: 0.1.0
description: |
  Build admin panels for Laravel with Filament 3 — the TALL-stack resource
  builder. Ships Resource conventions (form schema, table columns, filters,
  relation managers, pages) and form-component + table-column/action depth.
  Provides a /filament-resource command + agent + the FILAMENT-001/002 patterns.

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/bench-filament

depends_on:
  bench: ">=0.8.0"

homepage: https://filamentphp.com
license: MIT
