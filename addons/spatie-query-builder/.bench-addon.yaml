name: spatie-query-builder
version: 0.1.0
description: |
  Generate custom Eloquent query builder classes (extends Builder<Model>) to
  extract reusable, chainable query logic out of controllers and models. Ships a
  /query-builder command + agent; they read the core MODEL-002 query-builder
  pattern (no new pattern needed).

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/laravel-query-builder

depends_on:
  bench: ">=0.8.0"

license: MIT
