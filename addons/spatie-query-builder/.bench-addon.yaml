name: spatie-query-builder
version: 0.1.0
description: |
  Build filterable/sortable/includable API queries from request parameters with
  spatie/laravel-query-builder (QueryBuilder::for + allowedFilters/Sorts/Includes/
  Fields). Ships a /query-builder command + agent and the QUERYBUILDER-001 pattern.

  Opt-in addon — install per-project with:
    bench addon add spatie-query-builder

depends_on:
  bench: ">=0.8.0"

homepage: https://spatie.be/docs/laravel-query-builder
license: MIT
