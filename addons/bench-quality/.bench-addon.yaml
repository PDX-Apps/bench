name: bench-quality
version: 0.1.0
description: |
  A "work is done, verify before pushing" pipeline: scope the changes, run a
  code-review pass, run the project's CI gate, optionally run e2e locally, and
  report go/no-go. User-configurable pre/post steps via .bench/quality.yaml.
  Composes the ci + playwright addons (declared as dependencies) instead of
  duplicating them.

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/bench-quality

depends_on:
  bench: ">=0.8.0"
  addons: [bench-ci, bench-playwright]

license: MIT
