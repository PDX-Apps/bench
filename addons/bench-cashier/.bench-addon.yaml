name: bench-cashier
version: 0.1.0
description: |
  Laravel Cashier (Stripe) billing — subscriptions, plan swaps, trials,
  cancellation/grace periods, single charges, invoices, and secure webhook
  handling. Ships a /cashier command + agent and two CASHIER-00x patterns
  that wire the Billable model and the common subscription flows.

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/bench-cashier

depends_on:
  bench: ">=0.8.0"

license: MIT
