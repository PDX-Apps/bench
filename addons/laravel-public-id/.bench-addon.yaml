name: laravel-public-id
version: 0.1.0
description: |
  Expose ULID/UUID public identifiers in your API while keeping fast
  auto-increment integer primary keys internally — preventing ID enumeration
  while preserving join/index performance. Layers public-ID guidance onto the
  model, migration, and API-resource patterns (append mode).

  Opt-in addon — install per-project with:
    bench addon add /path/to/bench/addons/laravel-public-id

depends_on:
  bench: ">=0.8.0"

license: MIT
