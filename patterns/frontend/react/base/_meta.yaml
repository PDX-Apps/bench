# Base layer metadata for React patterns.
#
# Generic React + TS base: function components + hooks, Zustand, React Router,
# Vite, Vitest + Testing Library, TanStack Query (React Query), react-hook-form
# + Zod. Styling/UI-library/router/meta-framework choices are project-specific
# (detect-and-match) and ship as addons (tailwind, shadcn, mui,
# chakra, radix, tanstack-router, playwright,
# nextjs, remix).

target:
  react: "18.x"
  typescript: "5.x"
  react-router: "6.x"
  zustand: "5.x"
  vitest: "4.x"

